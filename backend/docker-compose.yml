services:
  db:
    image: postgres:16-alpine
    container_name: fieldshift_pg
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-fieldshift_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldshift_password}
      POSTGRES_DB: ${DB_NAME:-fieldshift_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldshift_user} -d ${DB_NAME:-fieldshift_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fieldshift_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
